[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["venv", "logs", ".pytest_cache"]

[tool.ruff.lint]
# Default ruff lint rules (pycodestyle E/W + pyflakes F) plus a few low-noise extras.
# - I: import sorting (isort)
# - B: flake8-bugbear (likely bugs)
# - UP: pyupgrade (modernize syntax for target-version)
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.format]
# Defaults: double quotes, space indent, 100-char line length (from [tool.ruff]).
