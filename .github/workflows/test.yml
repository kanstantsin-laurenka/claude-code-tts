name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Use Node.js 24 for JS-based actions now (forced default from 2026-06-02).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run --frozen ruff check .

      - name: ruff format --check
        run: uv run --frozen ruff format --check .

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      # python-version overrides .python-version, so each matrix leg gets its own interpreter.
      - name: Set up uv + Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pytest
        run: uv run --frozen pytest tests/ -v
